    - Music: user-guide/music.md
    - Games: user-guide/games.md
    - Books: user-guide/books.md
    - Streaming & Playback: user-guide/streaming.md
    - Devices, Casting & Offline: user-guide/devices.md
    - Lists & Collections: user-guide/lists.md
    - Favorites: user-guide/favorites.md
    - Viewing History: user-guide/history.md
    - Watch Parties: user-guide/watch-parties.md
    - Friends & Invites: user-guide/friends.md
    - User Settings: user-guide/settings.md
