{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamarr.secretName" . }}
  labels:
    {{- include "streamarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ required "secrets.postgresPassword is required when postgres.enabled=true and secrets.existingSecret is unset" .Values.secrets.postgresPassword | quote }}
  {{- end }}
  secret-key: {{ required "secrets.secretKey is required when secrets.existingSecret is unset" .Values.secrets.secretKey | quote }}
  lightrays-jwt-secret: {{ required "secrets.lightraysJwtSecret is required when secrets.existingSecret is unset" .Values.secrets.lightraysJwtSecret | quote }}
  downloader-webhook-secret: {{ required "secrets.downloaderWebhookSecret is required when secrets.existingSecret is unset" .Values.secrets.downloaderWebhookSecret | quote }}
{{- end -}}
