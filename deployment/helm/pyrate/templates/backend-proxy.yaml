{{/*
nginx proxy that fronts backend-python. Override the default config by
loading backend/proxy/nginx.conf via:

    helm install ... --set-file backend.proxy.nginxConfig=backend/proxy/nginx.conf

When unset we render a minimal default that forwards everything to
backend-python.
*/}}
{{- $proxyName := printf "%s-backend" (include "pyrate.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $proxyName }}-config
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "backend-proxy") | nindent 4 }}
data:
  nginx.conf: |-
{{- if .Values.backend.proxy.nginxConfig }}
{{ .Values.backend.proxy.nginxConfig | indent 4 }}
{{- else }}
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      error_log /dev/stderr info;

      # Map Upgrade through to the upstream so /api/ws and Lightrays signaling
      # can negotiate real WebSocket connections.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 8000;

        location /api/lightrays-ws/ {
          proxy_pass http://{{ include "pyrate.lightraysHost" . }}:{{ .Values.lightrays.service.apiPort }};
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
          proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
          proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }

        location / {
          proxy_pass http://{{ $proxyName }}-python:8000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # WebSocket upgrade pass-through.
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $proxyName }}
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "backend-proxy") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.proxy.service.port }}
      targetPort: http
  selector:
    {{- include "pyrate.selectorLabels" (dict "ctx" . "component" "backend-proxy") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $proxyName }}
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "backend-proxy") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pyrate.selectorLabels" (dict "ctx" . "component" "backend-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pyrate.componentLabels" (dict "ctx" . "component" "backend-proxy") | nindent 8 }}
      annotations:
        # Roll the deployment whenever the rendered nginx config changes.
        checksum/config: {{ .Values.backend.proxy.nginxConfig | default "default-proxy" | sha256sum }}
    spec:
      {{- include "pyrate.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: nginx
          image: {{ include "pyrate.image" (dict "ctx" . "img" .Values.backend.proxy.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $proxyName }}-config
