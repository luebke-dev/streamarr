{{- if .Values.downloaders.torrent.enabled -}}
{{- $name := printf "%s-torrent-downloader" (include "streamarr.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "torrent") | nindent 4 }}
spec:
  {{- if .Values.downloaders.torrent.service.dhtNodePort }}
  type: NodePort
  {{- else }}
  type: ClusterIP
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.downloaders.torrent.service.port }}
      targetPort: http
    - name: dht
      protocol: UDP
      port: {{ .Values.downloaders.torrent.service.dhtPort }}
      targetPort: dht
      {{- if .Values.downloaders.torrent.service.dhtNodePort }}
      nodePort: {{ .Values.downloaders.torrent.service.dhtNodePort }}
      {{- end }}
  selector:
    {{- include "streamarr.selectorLabels" (dict "ctx" . "component" "torrent") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "torrent") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "streamarr.selectorLabels" (dict "ctx" . "component" "torrent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamarr.componentLabels" (dict "ctx" . "component" "torrent") | nindent 8 }}
    spec:
      {{- include "streamarr.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # The torrent image bakes user `app` (UID 1000).
        fsGroup: 1000
      containers:
        - name: torrent
          image: {{ include "streamarr.image" (dict "ctx" . "img" .Values.downloaders.torrent.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: WEBHOOK_URL
              value: "http://{{ include "streamarr.backendHost" . }}:{{ .Values.backend.proxy.service.port }}/api/webhooks/torrent"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamarr.secretName" . }}
                  key: downloader-webhook-secret
            - name: MAX_CONCURRENT_DOWNLOADS
              value: {{ .Values.downloaders.torrent.maxConcurrentDownloads | quote }}
            - name: SEED_RATIO
              value: {{ .Values.downloaders.torrent.seedRatio | quote }}
          ports:
            - name: http
              containerPort: 3000
            - name: dht
              protocol: UDP
              containerPort: 6881
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.downloaders.torrent.resources | nindent 12 }}
          volumeMounts:
            - { name: downloads, mountPath: /downloads }
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ include "streamarr.fullname" . }}-downloads
{{- end -}}
