{{- if .Values.downloaders.spotdl.enabled -}}
{{- $name := printf "%s-spotdl" (include "pyrate.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "spotdl") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.downloaders.spotdl.service.port }}
      targetPort: http
  selector:
    {{- include "pyrate.selectorLabels" (dict "ctx" . "component" "spotdl") | nindent 4 }}
---
{{- if .Values.downloaders.spotdl.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "spotdl") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if or .Values.downloaders.spotdl.persistence.storageClass .Values.global.storageClass }}
  storageClassName: {{ default .Values.global.storageClass .Values.downloaders.spotdl.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.downloaders.spotdl.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "spotdl") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pyrate.selectorLabels" (dict "ctx" . "component" "spotdl") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pyrate.componentLabels" (dict "ctx" . "component" "spotdl") | nindent 8 }}
    spec:
      {{- include "pyrate.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # The spotdl image bakes user `app` (UID 1000); fsGroup makes the
        # mounted PVC readable+writable to that user without requiring an
        # init container to chown the volume.
        fsGroup: 1000
      containers:
        - name: spotdl
          image: {{ include "pyrate.image" (dict "ctx" . "img" .Values.downloaders.spotdl.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: WEBHOOK_URL
              value: "http://{{ include "pyrate.backendHost" . }}:{{ .Values.backend.proxy.service.port }}/api/webhooks/spotdl"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pyrate.secretName" . }}
                  key: downloader-webhook-secret
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.downloaders.spotdl.resources | nindent 12 }}
          {{- if .Values.downloaders.spotdl.persistence.enabled }}
          volumeMounts:
            - { name: data, mountPath: /data }
          {{- end }}
      {{- if .Values.downloaders.spotdl.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
      {{- end }}
{{- end -}}
