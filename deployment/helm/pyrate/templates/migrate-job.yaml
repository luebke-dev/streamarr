{{- if .Values.migrations.enabled -}}
{{- $name := printf "%s-migrate" (include "pyrate.fullname" .) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    # Run `alembic upgrade head` exactly once per release, before the app
    # Deployments are created/updated. Replaces the old per-pod alembic init
    # container so migrations can't race across backend/worker/scheduler pods.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "pyrate.componentLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      {{- include "pyrate.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        # backend image bakes appuser (UID/GID 1001).
        fsGroup: 1001
      containers:
        - name: migrate
          image: {{ include "pyrate.image" (dict "ctx" . "img" .Values.backend.python.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          workingDir: /app
          command: ["uv", "run", "alembic", "upgrade", "head"]
          env:
            {{- include "pyrate.commonEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "pyrate.databaseUrlAsync" . | quote }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end -}}
