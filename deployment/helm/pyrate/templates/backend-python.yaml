{{- if .Values.backend.python.enabled -}}
{{- $name := printf "%s-backend-python" (include "streamarr.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "backend-python") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "streamarr.selectorLabels" (dict "ctx" . "component" "backend-python") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "backend-python") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.python.replicas }}
  selector:
    matchLabels:
      {{- include "streamarr.selectorLabels" (dict "ctx" . "component" "backend-python") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamarr.componentLabels" (dict "ctx" . "component" "backend-python") | nindent 8 }}
    spec:
      {{- include "streamarr.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # backend image bakes appuser (UID/GID 1001); fsGroup keeps the
        # shared library / downloads / temp / users PVCs writable from
        # within the container.
        fsGroup: 1001
      serviceAccountName: {{ include "streamarr.computeServiceAccountName" . }}
      {{- with .Values.backend.python.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.python.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.python.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # See scheduler.yaml — Cilium drops first egress packets while
        # the pod's security identity propagates. Wait for redis +
        # elasticsearch to be reachable before starting the app, which
        # also forces the identity registration to settle.
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "streamarr.redisHost" . }} {{ .Values.redis.service.port }}; do echo "waiting for redis"; sleep 2; done
              until nc -z {{ include "streamarr.elasticsearchHost" . }} {{ .Values.elasticsearch.service.port }}; do echo "waiting for elasticsearch"; sleep 2; done
        # Migrations are NOT run here — a dedicated pre-install/pre-upgrade
        # Helm hook Job (templates/migrate-job.yaml) runs `alembic upgrade
        # head` exactly once per release, before any app pod rolls out.
      containers:
        - name: backend
          image: {{ include "streamarr.image" (dict "ctx" . "img" .Values.backend.python.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - uv
            - run
            - uvicorn
            - streamarr.web:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            {{- include "streamarr.commonEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "streamarr.databaseUrlAsync" . | quote }}
            - name: PROJECT_ROOT
              value: {{ .Values.persistence.hostPath.base | quote }}
            - name: COMPUTING_NAMESPACE
              value: {{ default .Release.Namespace .Values.transcoding.namespace | quote }}
            - name: COMPUTING_JOB_TTL_SECONDS
              value: {{ .Values.transcoding.jobTtlSeconds | quote }}
            {{- with .Values.transcoding.nodeSelector }}
            - name: COMPUTING_NODE_SELECTOR_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.transcoding.tolerations }}
            - name: COMPUTING_TOLERATIONS_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            - name: LIGHTRAYS_GAMING_STORAGE_CONTAINER
              value: /user-data
            - name: LIGHTRAYS_GAMING_STORAGE_HOST
              value: "{{ .Values.persistence.hostPath.base }}/data/users"
            {{- with .Values.backend.python.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              # FastAPI doesn't ship a generic health endpoint; auth/status
              # is the lightest route that always responds 200 once the
              # app has started up.
              path: /api/auth/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              # Use TCP for liveness so a 5xx on a deeper route doesn't
              # take down a pod that's still answering connections.
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.python.resources | nindent 12 }}
          volumeMounts:
            {{- include "streamarr.dataVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "streamarr.dataVolumes" . | nindent 8 }}
{{- end -}}
