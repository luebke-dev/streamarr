{{- if .Values.downloaders.usenet.enabled -}}
{{- $name := printf "%s-usenet-downloader" (include "streamarr.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "usenet") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.downloaders.usenet.service.port }}
      targetPort: http
  selector:
    {{- include "streamarr.selectorLabels" (dict "ctx" . "component" "usenet") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "usenet") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "streamarr.selectorLabels" (dict "ctx" . "component" "usenet") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamarr.componentLabels" (dict "ctx" . "component" "usenet") | nindent 8 }}
    spec:
      {{- include "streamarr.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # The usenet image bakes user `app` (UID 1000); fsGroup keeps the
        # shared downloads PVC writable from inside the container.
        fsGroup: 1000
      containers:
        - name: usenet
          image: {{ include "streamarr.image" (dict "ctx" . "img" .Values.downloaders.usenet.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: WEBHOOK_URL
              value: "http://{{ include "streamarr.backendHost" . }}:{{ .Values.backend.proxy.service.port }}/api/webhooks/usenet"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamarr.secretName" . }}
                  key: downloader-webhook-secret
            - name: DOWNLOAD_MAX_CONCURRENT_JOBS
              value: {{ .Values.downloaders.usenet.maxConcurrentJobs | quote }}
          envFrom:
            # Provider/auth — operator-supplied secret with USENET_HOST,
            # USENET_USERNAME, USENET_PASSWORD (+ optional _PORT, _TLS,
            # _CONNECTIONS, _RETENTION_DAYS).
            - secretRef:
                name: {{ required "downloaders.usenet.existingSecret is required when usenet.enabled=true" .Values.downloaders.usenet.existingSecret }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.downloaders.usenet.resources | nindent 12 }}
          volumeMounts:
            # Share the downloads PVC with backend / worker so completed
            # NZB extracts land where the importer can pick them up.
            - { name: downloads, mountPath: /downloads }
            # Per-pod sqlite job state — without this, every pod restart
            # wipes in-flight job IDs and Streamarr's polling sees an empty
            # queue.
            - { name: data, mountPath: /data }
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ include "streamarr.fullname" . }}-downloads
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "streamarr.fullname" . }}-usenet-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "streamarr.fullname" . }}-usenet-data
  labels:
    {{- include "streamarr.componentLabels" (dict "ctx" . "component" "usenet") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.downloaders.usenet.dataPersistence.storageClass | default $.Values.global.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.downloaders.usenet.dataPersistence.size | default "1Gi" }}
{{- end -}}
