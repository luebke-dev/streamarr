{{- if .Values.worker.enabled -}}
{{- $name := printf "%s-worker" (include "pyrate.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pyrate.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "pyrate.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pyrate.componentLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
    spec:
      {{- include "pyrate.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # backend image bakes appuser (UID/GID 1001).
        fsGroup: 1001
      serviceAccountName: {{ include "pyrate.computeServiceAccountName" . }}
      initContainers:
        # See scheduler.yaml — Cilium drops first egress packets while
        # the pod's security identity propagates. Worker connects to
        # both redis (TaskIQ broker) and elasticsearch.
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "pyrate.redisHost" . }} {{ .Values.redis.service.port }}; do echo "waiting for redis"; sleep 2; done
              until nc -z {{ include "pyrate.elasticsearchHost" . }} {{ .Values.elasticsearch.service.port }}; do echo "waiting for elasticsearch"; sleep 2; done
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "pyrate.image" (dict "ctx" . "img" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - uv
            - run
            - taskiq
            - worker
            - pyrate.worker:broker
          env:
            {{- include "pyrate.commonEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "pyrate.databaseUrlAsync" . | quote }}
            - name: PROJECT_ROOT
              value: {{ .Values.persistence.hostPath.base | quote }}
            - name: COMPUTING_NAMESPACE
              value: {{ default .Release.Namespace .Values.transcoding.namespace | quote }}
            - name: COMPUTING_JOB_TTL_SECONDS
              value: {{ .Values.transcoding.jobTtlSeconds | quote }}
            {{- with .Values.transcoding.nodeSelector }}
            - name: COMPUTING_NODE_SELECTOR_JSON
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.transcoding.tolerations }}
            - name: COMPUTING_TOLERATIONS_JSON
              value: {{ toJson . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "pyrate.dataVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "pyrate.dataVolumes" . | nindent 8 }}
{{- end -}}
