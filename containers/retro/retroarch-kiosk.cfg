# pyrate-retro — RetroArch KIOSK config
# ======================================
# Baked into the image and passed via `retroarch --config`. Its whole job is
# to make RetroArch a menu-less, controller-ready, fullscreen player that
# writes its saves under the per-game /home/retro state mount.
#
# config_save_on_exit = false keeps this file authoritative and immutable
# across container restarts (RetroArch never rewrites it).

# ── No UI: the whole point ───────────────────────────────────────────────
# Removes the menu subsystem entirely — it cannot be rendered or summoned by
# any hotkey, has zero per-frame overhead, and RetroArch exits when content
# closes (ideal for one-game-per-container).
menu_driver = "null"
menu_show_load_content = "false"
menu_show_start_screen = "false"
config_save_on_exit = "false"
quit_press_twice = "false"

# ── Display: fill the gamescope output ───────────────────────────────────
# gamescope owns the real mode/scaling; RetroArch just renders fullscreen.
video_driver = "glcore"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
# CRITICAL for headless/nested: without this a window that never gains focus
# pauses the emulator forever.
pause_nonactive = "false"

# ── Input: one RetroPad mapping for every core ───────────────────────────
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
input_max_users = "4"

# ── Audio: Pulse (lightrays injects PULSE_SERVER) ────────────────────────
audio_driver = "pulse"
audio_enable = "true"

# ── Paths: saves/states per-game (/home/retro), BIOS shared (/system) ────
# /home/retro is the per-game persistent state mount; /system is a separate
# read-only BIOS mount (present only when a game needs BIOS, e.g. PSX).
system_directory = "/system"
savefile_directory = "/home/retro/saves"
savestate_directory = "/home/retro/states"
rgui_config_directory = "/home/retro/config"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"

# ── Resume convenience ───────────────────────────────────────────────────
savestate_auto_load = "true"
savestate_auto_save = "false"

# ── Quiet: no notifications clutter over the stream ──────────────────────
video_font_enable = "true"
menu_enable_widgets = "false"
