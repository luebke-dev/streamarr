worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Re-resolve upstream DNS every 10s via Docker's embedded resolver.
    # Without this, nginx caches the upstream IP at startup and keeps hitting
    # the old address after backend-python gets a new IP on restart, causing
    # 502s until this container is reloaded.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward Upgrade through to FastAPI so /api/ws (and any other WebSocket
    # routes) can negotiate the connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000;
        server_name _;
        client_max_body_size 2G;

        location /api/lightrays-ws/ {
            set $lightrays_upstream http://lightrays:8080;
            proxy_pass $lightrays_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

        location / {
            # Use a variable so the resolver above actually re-resolves on
            # TTL expiry. A literal ``proxy_pass http://name`` is resolved
            # once at startup and cached forever — exactly what the
            # resolver directive was added to avoid.
            set $backend_python_upstream http://backend-python:8000;
            proxy_pass $backend_python_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
