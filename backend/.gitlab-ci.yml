stages:
  - test
  - build

variables:
  IMAGE: $CI_REGISTRY_IMAGE

test:
  stage: test
  when: manual
  allow_failure: true
  variables:
    SECRET_KEY: "ci-test-secret-key-not-for-production"
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - curl -LsSf https://astral.sh/uv/install.sh | sh
  timeout: 30m
  script:
    - uv sync --frozen --dev
    - uv run pytest --tb=short -q --cov=pyrate --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:htmlcov
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 30 days

.build_base:
  stage: build
  image: quay.io/buildah/stable
  variables:
    STORAGE_DRIVER: vfs
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:dev:
  extends: .build_base
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - buildah bud -f Containerfile -t $IMAGE:dev .
    - buildah push $IMAGE:dev

build:release:
  extends: .build_base
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{4}\.\d+\.\d+$/
  script:
    - buildah bud -f Containerfile -t $IMAGE:$CI_COMMIT_TAG -t $IMAGE:latest .
    - buildah push $IMAGE:$CI_COMMIT_TAG
    - buildah push $IMAGE:latest
