name: Desktop app CI

# The desktop app is two Rust crates plus the frontend they embed:
#
#   desktop/player        shell-independent core (no GUI dependency)
#   frontend/src-tauri    the Tauri shell (windows, IPC, transport)
#   frontend/             the web UI, built into what the shell embeds
#
# This workflow is separate from rust.yml because the shell needs system
# libraries that the other crates do not (webkit2gtk, gtk3, libsoup, keyring),
# and because a failure here should be attributed to the app rather than to the
# shared crate matrix.
#
# What it gates and what it only reports:
#
#   cargo test        gate — this is the real contract check, including the golden
#                     tests that read lightrays/src and backend/src and fail if a
#                     field name the client sends stops matching the server.
#   cargo fmt         gate — both crates were formatted before their first commit,
#                     so unlike the other crates in this repo there is no
#                     pre-existing backlog and a clean run is achievable.
#   cargo clippy      gate — same reason: the baseline is zero warnings, verified
#                     locally with the same command, including -D warnings.
#   frontend tests    gate with a documented baseline. The frontend has 24 known
#                     failing tests across 9 spec files (pre-existing, unrelated to
#                     the desktop work). Their count is asserted, so a *new*
#                     failure fails the job while the known ones do not block it.
#   yarn build        gate — the shell embeds ../dist/spa, so a broken build is a
#                     broken app.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── The shell-independent core, feature-free and with its native features ──
  #
  # Run in a plain container with no system libraries, which is the point of the
  # feature split: the crate must stay buildable and its golden tests runnable
  # without GStreamer, mpv or libudev.
  player:
    name: Core crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/player
      - name: Format
        working-directory: desktop/player
        run: cargo fmt --all --check
      - name: Clippy (no features)
        working-directory: desktop/player
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (no features)
        working-directory: desktop/player
        run: cargo test --locked
      # Every feature variant, not just the default. Each one adds code that is
      # otherwise never compiled: `mpv` brings the player integration, `spike` the
      # GStreamer pipeline, `gamepad` the controller reader. A change that only
      # breaks one of them would leave the default build green — and the feature
      # that is broken is exactly the one a user asked for.
      # GStreamer's development headers, needed by the `spike` variant below.
      # Without them that variant cannot be compiled at all — which is also why
      # this step exists rather than a bare `cargo clippy --all-features`: the
      # point is to compile each variant on its own, so a failure names the
      # feature that broke instead of the whole set.
      - name: GStreamer development libraries
        run: |
          sudo apt-get update
          # `-bad` carries `gstreamer-webrtc-1.0.pc`. Without it the `spike` feature
          # fails in the build script of `gstreamer-webrtc-sys`, which reads as a Rust
          # error and is a missing C development package.
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
          version=$(pkg-config --modversion gstreamer-1.0)
          echo "GStreamer $version"
          # Also assert the module the feature actually needs, so a future image that
          # drops `-bad` says so here instead of in a build script 200 lines later.
          pkg-config --exists gstreamer-webrtc-1.0 || {
            echo "::error::gstreamer-webrtc-1.0 fehlt (Paket libgstreamer-plugins-bad1.0-dev)"
            exit 1
          }
          required=1.22
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -1)" != "$required" ]; then
            echo "::error::GStreamer $version ist aelter als $required; das spike-Feature braucht send_string_full"
            exit 1
          fi
      - name: Clippy (every feature variant)
        working-directory: desktop/player
        run: |
          set -euo pipefail
          for feature in gamepad mpv spike; do
            echo "--- clippy --features $feature ---"
            cargo clippy --locked --features "$feature" --all-targets -- -D warnings
          done
      # The wire-contract tests read ../lightrays/src and ../backend/src. They skip
      # when those are absent, so this asserts the paths really resolved — otherwise
      # the suite could degrade into no-ops that report success.
      - name: Golden tests reached the server sources
        working-directory: desktop/player
        run: cargo test --locked --test wire_contract -- --nocapture
      # The mpv and WebRTC layer can only be verified against real programs. Both
      # silently *skip* when their prerequisites are missing, so installing them
      # here is what stops this job from passing while proving nothing. mpv is in
      # the standard Ubuntu archives and xvfb gives it a display; the tests use
      # --vo=null so no real GPU is needed.
      - name: Install mpv and a display for the integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv ffmpeg xvfb
      - name: Generate the test media
        run: ./desktop/scripts/make_test_media.sh
      - name: mpv integration tests against a real mpv
        working-directory: desktop/player
        run: |
          set -o pipefail
          # `--test-threads=1` is not needed (each player gets its own socket), but
          # the output is easier to read and a failure is easier to attribute.
          xvfb-run -a cargo test --locked --test mpv_integration -- --nocapture 2>&1 | tee /tmp/mpv-it.log
          # Guard against a silent skip: the file has 12 tests, and a run that
          # executes fewer means a prerequisite was missing.
          executed=$(grep -cE "^test .+ \.\.\. (ok|FAILED)" /tmp/mpv-it.log)
          echo "Ausgeführte mpv-Integrationstests: $executed"
          if [ "$executed" -lt 12 ]; then
            echo "::error::$executed statt 12 mpv-Tests liefen — die übrigen wurden stillschweigend übersprungen"
            exit 1
          fi
          if grep -q "übersprungen" /tmp/mpv-it.log; then
            echo "::error::ein mpv-Test hat sich wegen fehlender Voraussetzungen übersprungen"
            exit 1
          fi
      - name: Test (gamepad feature)
        working-directory: desktop/player
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          cargo test --locked --features gamepad

  # ── The Tauri shell ──
  shell:
    name: Tauri shell
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      # The shell embeds the built frontend, so the dist tree has to exist before
      # `tauri::generate_context!` is expanded.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the frontend the shell embeds
        working-directory: frontend
        run: |
          # `frontend/yarn.lock` is a Yarn classic (v1) lockfile and the runners ship
          # Yarn 1, so this is the same install the working frontend workflow uses.
          # `corepack` was wrong here: it is the Berry entry point and the project has no
          # `packageManager` field for it to read.
          yarn install --frozen-lockfile
          yarn build
      - name: Format
        working-directory: frontend/src-tauri
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: frontend/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: frontend/src-tauri
        run: cargo test --locked
      # The default build links **no** GStreamer, which is the constraint the
      # feature arrangement exists to keep; the `gamestream` build adds the whole
      # game pipeline. Both have to compile, and a change that only breaks one of
      # them would leave the other green — so both are checked.
      #
      # GStreamer must be **1.22 or newer** (`gstreamer-webrtc`'s `v1_22` provides
      # the *checked* data-channel send, without which a full send buffer drops an
      # input message silently). The installed version is asserted so a future
      # move to an older image gives a clear message instead of a wall of compiler
      # errors. Measured: 24.04 ships 1.24.2.
      - name: Game streaming must build too
        working-directory: frontend/src-tauri
        run: |
          set -euo pipefail
          version=$(pkg-config --modversion gstreamer-1.0)
          echo "GStreamer $version"
          required=1.22
          if [ "$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -1)" != "$required" ]; then
            echo "::error::GStreamer $version ist aelter als $required"
            exit 1
          fi
          cargo clippy --locked --features gamestream --all-targets -- -D warnings
          cargo test --locked --features gamestream
      - name: The bare shell must still build without GStreamer
        working-directory: frontend/src-tauri
        run: |
          set -euo pipefail
          # The reason the feature exists: a stray unconditional import of a
          # `spike`-gated type broke exactly this once, and the compiler caught it
          # only because this build was run. `cargo check` is enough — the question
          # is whether it compiles, not what it links.
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings


  # ── Installable bundles ──
  # Building the packages is the point: a bundling configuration that no one runs rots
  # silently. The `.deb` gets built *and installed* into the runner, which is the closest
  # thing to a real installation available without a VM.
  bundles:
    name: Bundles (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            rpm \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          # `frontend/yarn.lock` is a Yarn classic (v1) lockfile and the runners ship
          # Yarn 1, so this is the same install the working frontend workflow uses.
          # `corepack` was wrong here: it is the Berry entry point and the project has no
          # `packageManager` field for it to read.
          yarn install --frozen-lockfile
      - name: Versions must agree across the three files
        # Before anything is built: a mismatch here means the update checker
        # offers an update that is already installed, or none when one exists.
        run: desktop/scripts/check_versions.sh
      - name: Build bundles
        working-directory: frontend
        # AppImage is excluded on purpose: it needs FUSE to run, which the runner has,
        # but building it downloads three helper binaries from GitHub and adds minutes
        # to every run. `.deb` and `.rpm` cover the packaging configuration.
        run: npx tauri build --bundles deb,rpm
      - name: Inspect the .deb
        run: |
          set -euo pipefail
          DEB=$(ls frontend/src-tauri/target/release/bundle/deb/*.deb)
          echo "Paket: $DEB"
          dpkg-deb -I "$DEB"
          # The binary, the desktop entry and an icon must all be there.
          dpkg-deb -c "$DEB" > /tmp/contents.txt
          grep -q 'usr/bin/Streamarr' /tmp/contents.txt
          grep -q 'usr/share/applications/Streamarr.desktop' /tmp/contents.txt
          grep -q 'usr/share/icons' /tmp/contents.txt
          # Every directly linked library must be declared. This is the check that
          # catches the failure mode with the worst timing: an undeclared library
          # installs cleanly and crashes on start on a machine that is not this one.
          # `libudev` arrived with the `gamepad` feature and was missing exactly so.
          RPM=$(ls frontend/src-tauri/target/release/bundle/rpm/*.rpm)
          desktop/scripts/check_bundle_deps.sh \
            frontend/src-tauri/target/release/Streamarr "$DEB" "$RPM"
          # The shipped package must contain the game pipeline. `tauri build`
          # uses the `build.features` from the configuration, and the default build
          # does not have it — so this asserts the wiring actually reached the
          # artefact. A package without it installs, starts, and cannot play games,
          # which is the kind of defect that reaches a user.
          if ! strings frontend/src-tauri/target/release/Streamarr | grep -q recvonly; then
            echo "::error::Der Spielestream fehlt im Paket (build.features nicht wirksam?)"
            exit 1
          fi
          echo "Spielestream im Binary vorhanden."
          # And the dependencies must not be duplicated. A duplicate is not fatal, but
          # it means the configuration and Tauri both added them, which is the sign of a
          # `depends` list that does not know what it is doing.
          depends=$(dpkg-deb -f "$DEB" Depends)
          echo "Depends: $depends"
          count=$(echo "$depends" | tr ',' '\n' | sed 's/ //g' | sort | uniq -d | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "::error::Doppelte Abhängigkeiten im Paket: $depends"
            exit 1
          fi
      - name: Install the .deb and run it
        run: |
          set -euo pipefail
          # `apt-get install -y ./file.deb` resolves the dependencies from the archive.
          sudo apt-get install -y ./frontend/src-tauri/target/release/bundle/deb/*.deb
          # The binary must be where the package says, and it must start. A missing mpv
          # is expected on the runner and does not stop the app from reaching its window.
          command -v Streamarr
          # `xvfb-run` gives it a display; without one, GTK aborts before the app's own
          # code runs and the test would prove nothing.
          sudo apt-get install -y xvfb
          set +e
          timeout 25 xvfb-run -a Streamarr > /tmp/app.log 2>&1
          status=$?
          set -e
          echo "--- Ausgabe ---"
          cat /tmp/app.log
          # 124 means the timeout killed it, i.e. it was still running - which is what a
          # working app does. Anything else is a crash.
          if [ "$status" -ne 124 ]; then
            echo "::error::Die installierte App endete mit Status $status statt zu laufen."
            exit 1
          fi
          # It must have got as far as reading its configuration.
          grep -q 'Konfiguration:' /tmp/app.log

  # ── Windows bundles ──
  #
  # There is no Windows host in this project, so this job is the *only* place the
  # NSIS and MSI targets are ever exercised. That is the honest limit: the
  # configuration is checked here, but a build that only ever runs in CI has not
  # been run by a person.
  #
  # A note on what this cannot prove: Windows has no equivalent of `ldd` in the
  # Linux sense, so the missing-dependency class of failure that
  # `check_bundle_deps.sh` catches on Linux is caught here by *building* the
  # installers, which fails if the linker cannot resolve a symbol.
  bundles-windows:
    name: Bundles (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          # `frontend/yarn.lock` is a Yarn classic (v1) lockfile and the runners ship
          # Yarn 1, so this is the same install the working frontend workflow uses.
          # `corepack` was wrong here: it is the Berry entry point and the project has no
          # `packageManager` field for it to read.
          yarn install --frozen-lockfile
      - name: Build the NSIS and MSI installers
        working-directory: frontend
        shell: bash
        # Both targets, so a configuration that only works for one is visible. The
        # step fails if either bundler cannot run.
        #
        # The `gamestream` feature is overridden away on purpose. It needs GStreamer's
        # **MSVC development package**, which this runner does not have and which is not
        # a `choco`/`apt` one-liner; `gstreamer-webrtc-sys` fails in its build script
        # without it (measured on Linux, same build script). So the Windows installers
        # carry the native media path and **not** game streaming. That limit is real and
        # is written down in docs/docs/user-guide/desktop.md rather than papered over
        # with a green tick.
        run: npx tauri build --bundles nsis,msi --config '{"build":{"features":[]}}'
      - name: Assert both installers exist
        shell: bash
        run: |
          set -euo pipefail
          ls -la frontend/src-tauri/target/release/bundle/nsis/
          ls -la frontend/src-tauri/target/release/bundle/msi/
          # A bundler that "succeeds" without writing a file would make the step above
          # meaningless, so the artefacts are counted rather than assumed.
          nsis=$(ls frontend/src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | wc -l)
          msi=$(ls frontend/src-tauri/target/release/bundle/msi/*.msi 2>/dev/null | wc -l)
          echo "NSIS: $nsis, MSI: $msi"
          if [ "$nsis" -lt 1 ] || [ "$msi" -lt 1 ]; then
            echo "::error::Es fehlt ein Installer (NSIS: $nsis, MSI: $msi)."
            exit 1
          fi

  # ── The web UI, held to its documented baseline ──
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: |
          # `frontend/yarn.lock` is a Yarn classic (v1) lockfile and the runners ship
          # Yarn 1, so this is the same install the working frontend workflow uses.
          # `corepack` was wrong here: it is the Berry entry point and the project has no
          # `packageManager` field for it to read.
          yarn install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: yarn lint
      - name: Build
        working-directory: frontend
        run: yarn build
      # The 24 known failures are pre-existing and unrelated to the desktop work.
      # Asserting the count keeps them visible: a new failure raises the number and
      # fails here, while the known ones do not block every future change.
      - name: Test against the documented baseline
        working-directory: frontend
        run: |
          set +e
          # `test:unit` is already `vitest run`; adding --run would be redundant.
          yarn test:unit 2>&1 | tee /tmp/vitest.log
          status=$?
          set -e
          failures=$(grep -oE 'Tests +[0-9]+ failed' /tmp/vitest.log | grep -oE '[0-9]+' | head -1)
          failures=${failures:-0}
          echo "Fehlgeschlagene Tests: $failures (Baseline 24)"
          if [ "$failures" -gt 24 ]; then
            echo "::error::$failures Tests fehlgeschlagen, Baseline ist 24 - neue Regression"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$failures" -eq 0 ]; then
            echo "::error::Der Testlauf ist fehlgeschlagen, ohne Tests zu melden"
            exit 1
          fi
